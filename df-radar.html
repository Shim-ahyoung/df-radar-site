<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="리테일 브리핑">
</head>
<body>
<title>리테일 브리핑 · 유통·면세 동향</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* DF Radar 디자인 시스템(2026-10-18 에디토리얼 리디자인, docs/DESIGN.md).
   카드 없음: 흰 바탕 · 검정 글씨 · 얇은 구분선 · 12단 그리드로 나눈다. 색은 흑·백·회색, 강조는 신라 레드를 선택된 메뉴에만.
   글자 위계는 크기보다 굵기와 여백으로. 그림자·둥근 상자·색 배지·그라데이션은 쓰지 않는다. */
:root {
  --bg: #ffffff;
  --ink: #191919;      /* 본문 글자 */
  --ink-2: #666666;    /* 요약·보조 */
  --muted: #888888;    /* 출처·날짜·메타 */
  --faint: #b5b5b5;    /* 비활성 */
  --line: #e3e3e3;     /* 구분선 */
  --line-strong: #222222; /* 섹션 머리선 */
  --hover: #f7f7f7;
  --accent: #c4313f;   /* 신라 레드: 선택된 메뉴 밑줄·로고 점에만 */
  /* 4사 구분 색(사용자 요청): 회사 이름 앞 사각형·4사 단 머리선·기업 탭 밑줄에만. 글자·바탕에는 쓰지 않는다 */
  --c-shilla: #c4313f; --c-lotte: #2a78d6; --c-shinsegae: #d98a00; --c-hyundai: #1b9e6f;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", system-ui, sans-serif;
  --w: 1240px;   /* 본문 최대 너비 */
  --gut: 32px;   /* 단 사이 */
  --pad: 32px;   /* 좌우 여백 */
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.6; letter-spacing: -0.003em; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: default; color: var(--faint); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: inherit; text-underline-offset: 3px; }
h1, h2, h3, h4, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 11.5px; font-weight: 400; line-height: 1.5; letter-spacing: 0; }
.n { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 4px; font-variant-numeric: tabular-nums; }
.more { color: var(--ink-2); font-size: 12px; font-weight: 400; border-bottom: 1px solid var(--line); padding-bottom: 1px; line-height: 1.4; }
.more:hover { color: var(--ink); border-bottom-color: var(--ink); }
.more.block { display: block; margin: 18px auto 0; }
.sample { background: var(--ink); color: var(--bg); font-size: 12px; }
.sample .wrap { max-width: var(--w); margin: 0 auto; padding: 6px var(--pad); display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 머리띠: 낮게. 로고 · 메뉴 · 검색 */
.mast { position: sticky; top: 0; z-index: 12; background: var(--bg); border-bottom: 1px solid var(--line); }
.mast-in { max-width: var(--w); margin: 0 auto; padding: 0 var(--pad); height: 52px; display: flex; align-items: center; gap: 36px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; white-space: nowrap; }
.logo img { display: block; width: 30px; height: 30px; margin-right: -2px; }
.logo b { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.logo span { font-size: 11.5px; color: var(--muted); }
.nav { display: flex; gap: 26px; height: 100%; }
.nav button { height: 100%; font-size: 13.5px; color: var(--ink-2); border-bottom: 2px solid transparent; padding-top: 2px; white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.qform { margin-left: auto; display: flex; align-items: center; }
.qform input { width: 220px; height: 30px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 0 2px; font-size: 13px; color: var(--ink); border-radius: 0; }
.qform input::placeholder { color: var(--muted); }
.qform input:focus { outline: none; border-bottom-color: var(--ink); }
.qform button { font-size: 12.5px; color: var(--ink-2); margin-left: 10px; }
.qform button:hover { color: var(--ink); }
.nav .n { font-weight: 400; }

/* ---------- 본문 틀 */
.page { max-width: var(--w); margin: 0 auto; padding: 0 var(--pad); }
main.page { padding-top: 26px; padding-bottom: 56px; min-height: 60vh; }
.phead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding-bottom: 12px; border-bottom: 2px solid var(--line-strong); }
.phead h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
.phead .dek { font-size: 13px; color: var(--ink-2); }
.label { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em; color: var(--ink); padding: 0 0 9px; border-bottom: 1px solid var(--line-strong); margin-bottom: 4px; }
.label .note { font-weight: 400; }
.label .more { margin-left: auto; }
h2.sec { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; font-size: 18px; font-weight: 700; letter-spacing: -0.015em; padding: 12px 0 10px; border-top: 2px solid var(--line-strong); }
h2.sec button:hover { text-decoration: underline; text-underline-offset: 4px; }
h2.sec .note { font-size: 12px; }
.band { margin-top: 40px; }
.none { color: var(--muted); font-size: 12.5px; padding: 10px 0; }
.empty { padding: 28px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; color: var(--muted); font-size: 13px; }

/* ---------- 기사(카드 없음): 꼬리표 · 제목 · 요약 · 출처 */
.stories { display: grid; }
.story { position: relative; border-top: 1px solid var(--line); }
.stories > .story:first-child, .label + .story { border-top: 0; }
.story .hit { display: grid; gap: 4px; width: 100%; padding: 13px 0 14px; text-align: left; }
.story .hit:hover .hl { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
/* 저장(☆): 기사 오른쪽 위, 회색 글자 하나. 저장하면 검정 ★ */
.story.md .hit, .story.lead .hit { padding-right: 34px; }
.save { position: absolute; top: 9px; right: -6px; width: 34px; height: 34px; font-size: 15px; line-height: 1; color: var(--faint); text-align: center; }
.save:hover { color: var(--ink); }
.save[aria-pressed="true"] { color: var(--ink); }
.story.gone .hl { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.dacts { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.save-lg { font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); padding-bottom: 1px; white-space: nowrap; }
.save-lg:hover, .save-lg[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.warn { font-size: 12.5px; color: var(--accent); padding: 10px 0 0; }
.kicker { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 11.5px; line-height: 1.4; }
.kick { color: var(--ink); font-weight: 600; }
.co-shilla { --c: var(--c-shilla); } .co-lotte { --c: var(--c-lotte); } .co-shinsegae { --c: var(--c-shinsegae); } .co-hyundai { --c: var(--c-hyundai); }
.cm { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.cm::before, .cotab::before, .co-cols .col h3::before { content: ""; width: 7px; height: 7px; background: var(--c); flex: none; }
.dl .cm + .cm { margin-left: 12px; }
.rel { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; color: var(--muted); }
.rel .cm { color: var(--ink-2); font-weight: 500; }
.rv { color: var(--muted); border-bottom: 1px dotted var(--muted); line-height: 1.2; }
.hl { font-size: 15px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; color: var(--ink); }
.sum { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.ev { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 13px; color: var(--ink); line-height: 1.55; }
.ev i { font-style: normal; color: var(--muted); font-size: 11.5px; margin-right: 6px; }
/* 브리핑의 첫 기사 */
.story.lead .hit { padding: 14px 0 18px; gap: 6px; }
.story.lead .hl { font-size: 21px; font-weight: 700; line-height: 1.38; letter-spacing: -0.02em; }
.story.lead .sum { font-size: 14px; -webkit-line-clamp: 3; color: #4a4a4a; }
/* 단·옆 칸의 짧은 기사(요약 없음) */
.story.sm .hit { padding: 10px 0 11px; gap: 3px; }
.story.sm .hl { font-size: 14px; font-weight: 500; line-height: 1.5; }
.story.sm .ev { font-size: 12px; }
.day { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); padding: 18px 0 6px; border-bottom: 1px solid var(--line-strong); }
.list > .day:first-child, .search-list > .day:first-child { padding-top: 6px; }

/* ---------- 오늘의 브리핑 */
.wk { padding: 16px 0 6px; }
.wk .label { border-bottom-color: var(--line); }
.wk-cols { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 0; }
.wk-cols > div { padding: 8px var(--gut) 0 0; min-width: 0; }
.wk-cols > div + div { border-left: 1px solid var(--line); padding-left: calc(var(--gut) / 1.3); }
.wk-cols > div:last-child { padding-right: 0; }
.wk-cols h3 { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.wk-cols li, .rail-wk li { font-size: 13px; line-height: 1.6; padding: 3px 0; }
.ref { font-size: 10.5px; color: var(--ink-2); vertical-align: super; line-height: 0; margin-left: 2px; padding: 0 1px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ref:hover { color: var(--ink); border-bottom-color: var(--ink); }
.lead-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0; margin-top: 22px; }
.main-col { padding-right: var(--gut); min-width: 0; }
.side-col { padding-left: var(--gut); border-left: 1px solid var(--line); min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--gut); border-top: 1px solid var(--line); }
.grid2 .story { border-top: 0; }
.grid2 .story:nth-child(n+3) { border-top: 1px solid var(--line); }
.col h3 button:hover { text-decoration: underline; text-underline-offset: 3px; }
.band .lead-grid { margin-top: 4px; }
.band-sub { margin-top: 28px; }
.cols { display: grid; gap: 0; }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.col { padding: 0 calc(var(--gut) / 1.3) 0 0; min-width: 0; }
.col + .col { padding-left: calc(var(--gut) / 1.3); border-left: 1px solid var(--line); }
.col:last-child { padding-right: 0; }
.col h3 { display: flex; align-items: baseline; font-size: 13px; font-weight: 700; padding: 2px 0 6px; border-bottom: 1px solid var(--line); }

/* ---------- 텍스트 탭(기업·카테고리·단계): 밑줄만 */
.ttabs { display: flex; flex-wrap: wrap; gap: 0 22px; border-bottom: 1px solid var(--line); margin-top: 14px; }
.ttabs button { font-size: 13px; color: var(--ink-2); padding: 9px 0 8px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.ttabs button:hover { color: var(--ink); }
.ttabs button.zero { color: var(--faint); }
.ttabs button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.ttabs.lg button { font-size: 14.5px; padding: 11px 0 9px; }
.cotab { display: inline-flex; align-items: center; gap: 6px; }
.cotab[aria-pressed="true"] { border-bottom-color: var(--c); }
.ttabs.lg + .ttabs { margin-top: 0; }
.catdesc { font-size: 12px; color: var(--muted); padding: 8px 0 0; }

/* ---------- 기간 · 상세 필터: 글자만 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.per, .fbar, .fg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.lab { color: var(--muted); font-size: 12px; min-width: 2.5em; }
.opts { display: inline-flex; flex-wrap: wrap; gap: 2px 14px; }
.opts button { color: var(--ink-2); padding: 2px 0; border-bottom: 1px solid transparent; }
.opts button:hover { color: var(--ink); }
.opts button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.per-nav { display: inline-flex; align-items: baseline; gap: 8px; color: var(--ink); }
.per-nav button { color: var(--ink-2); font-size: 15px; line-height: 1; padding: 0 4px; }
.per-nav button:hover:not(:disabled) { color: var(--ink); }
.per-custom { display: inline-flex; align-items: center; gap: 6px; }
.per-custom input { border: 0; border-bottom: 1px solid var(--line); padding: 2px 0; font-size: 12.5px; background: none; }
.ftoggle { color: var(--ink-2); }
.ftoggle::after { content: " ▾"; font-size: 10px; color: var(--muted); }
.ftoggle[aria-expanded="true"] { color: var(--ink); font-weight: 600; }
.ftoggle[aria-expanded="true"]::after { content: " ▴"; }
.fon { color: var(--ink); border-bottom: 1px solid var(--ink); }
.fon span { color: var(--muted); }
.fpanel { flex-basis: 100%; display: grid; gap: 7px; padding: 10px 0 2px; border-top: 1px dashed var(--line); }
.fg .lab { min-width: 5.2em; }
.fg .opts button:disabled { border-bottom-color: transparent; }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.chk input { accent-color: var(--ink); margin: 0; }

/* ---------- 목록 + 오른쪽 칸 */
.list-grid { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 0; align-items: start; }
.list { min-width: 0; padding-right: var(--gut); }
.rail { padding: 6px 0 0 var(--gut); border-left: 1px solid var(--line); min-width: 0; display: grid; gap: 26px; align-content: start; }
.rail section { display: grid; gap: 4px; }
.rail .label { margin-bottom: 0; }
.list-grid.solo { grid-template-columns: minmax(0, 1fr); }
.list-grid.solo .list { padding-right: 0; }
.co-cols { margin-top: 16px; }
.co-cols .col h3 { font-size: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--c); display: flex; align-items: center; gap: 7px; }
.co-cols .more { margin-top: 10px; display: inline-block; }

/* ---------- 검색 */
.sbox { padding-top: 14px; }
.sbox input { width: 100%; font-size: 17px; border: 0; border-bottom: 1px solid var(--ink); padding: 6px 0 8px; background: none; border-radius: 0; }
.sbox input:focus { outline: none; }
.sbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 12px 0 0; font-size: 12px; color: var(--muted); }
.sbar .acts { display: inline-flex; gap: 16px; }
.search-list { padding-right: 0; }
#dcopy-box textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--line); padding: 8px; margin-top: 6px; }

/* ---------- 바닥글 */
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; width: calc(100% - var(--pad) * 2); max-width: calc(var(--w) - var(--pad) * 2); padding: 14px 0 40px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.foot .more { font-size: 11.5px; color: var(--muted); }

/* ---------- 서랍(기사 상세): 테두리 한 줄 */
.drawer-back { position: fixed; inset: 0; background: rgba(25, 25, 25, 0.28); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; border-left: 1px solid var(--line-strong); padding: calc(14px + env(safe-area-inset-top, 0px)) 28px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; align-content: start; gap: 12px; }
.drawer-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.drawer-top button { font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.drawer-top button:hover { color: var(--ink); border-bottom-color: var(--ink); }
.drawer h2 { font-size: 20px; line-height: 1.4; font-weight: 700; letter-spacing: -0.02em; }
.drawer .kicker { font-size: 12px; font-weight: 600; }
.drawer .orig { color: var(--ink-2); font-size: 13px; }
.drawer .dsum { font-size: 14px; line-height: 1.7; color: #3a3a3a; }
.drawer section { display: grid; gap: 8px; padding-top: 6px; }
.drawer h3 { font-size: 12px; font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--line-strong); }
.src-main a { font-size: 13.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.srcs { display: grid; gap: 4px; font-size: 13px; }
.srcs a { text-decoration: underline; text-decoration-color: var(--line); }
.drawer blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--line); font-size: 13px; color: var(--ink-2); }
.dl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 7px 14px; font-size: 13px; }
.dl dt { color: var(--muted); font-size: 12px; padding-top: 1px; }

/* 말풍선 */
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 11.5px; padding: 6px 8px; max-width: 280px; line-height: 1.45; }

/* ---------- 노트북 */
@media (max-width: 1180px) {
  :root { --gut: 24px; --pad: 24px; }
  .nav { gap: 20px; }
  .qform input { width: 170px; }
  .logo span { display: none; }
}
/* ---------- 태블릿: 4단 → 2단, 오른쪽 칸은 아래로 */
@media (max-width: 960px) {
  .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-4 .col:nth-child(3) { border-left: 0; padding-left: 0; }
  .cols-4 .col:nth-child(n+3) { margin-top: 18px; }
  .list-grid { grid-template-columns: minmax(0, 1fr); }
  .list { padding-right: 0; }
  .rail { border-left: 0; padding: 22px 0 0; border-top: 2px solid var(--line-strong); margin-top: 18px; }
}
/* ---------- 휴대폰: 한 단, 구분선·글자 원칙은 그대로 */
@media (max-width: 768px) {
  :root { --pad: 16px; --gut: 16px; }
  .mast-in { height: auto; flex-wrap: wrap; gap: 0 12px; padding-top: 10px; }
  .logo { order: 1; }
  .qform { order: 2; margin-left: auto; }
  .qform input { width: 132px; height: 32px; font-size: 14px; }
  .qform button { display: none; }
  .nav { order: 3; flex-basis: 100%; height: 42px; gap: 0; justify-content: space-between; margin-top: 4px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { font-size: 14px; padding: 0 2px; }
  main.page { padding-top: 18px; }
  .phead h1 { font-size: 21px; }
  .phead .dek { flex-basis: 100%; font-size: 12.5px; }
  .wk-cols, .cols-3, .cols-4, .lead-grid, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .wk-cols > div, .col, .cols-4 .col { padding: 0; }
  .wk-cols > div + div, .col + .col { border-left: 0; padding-left: 0; }
  .wk-cols > div + div { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
  .main-col { padding-right: 0; }
  .side-col { padding-left: 0; border-left: 0; margin-top: 26px; }
  .grid2 .story:nth-child(n+2) { border-top: 1px solid var(--line); }
  .col + .col, .cols-4 .col:nth-child(n+3) { margin-top: 20px; }
  .story.lead .hl { font-size: 19px; }
  .story .hit { padding: 12px 0 13px; }
  /* 탭은 한 줄로 밀어 본다(본문은 가로로 넘치지 않는다) */
  .ttabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--pad) * -1); padding-inline: var(--pad); }
  .ttabs::-webkit-scrollbar { display: none; }
  .ttabs button { padding: 11px 0 10px; }
  .toolbar { gap: 10px 20px; }
  .opts button { padding: 6px 0; }
  .fg { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .fpanel { gap: 10px; }
  .dl { grid-template-columns: 68px minmax(0, 1fr); }
  .drawer { padding-inline: 18px; border-left: 0; }
  .foot { flex-direction: column; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.16s ease-out; }
  @keyframes slide { from { transform: translateX(16px); opacity: 0.7; } to { transform: none; opacity: 1; } }
}

    if (it.start_on && it.end_on) return 'active';
    return 'undated';
  }

  function exposureStatus(it, site) {
    if (!it.listing) return 'unverifiable';
    if (site && (site.status === 'incomplete' || site.status === 'failed' || site.status === 'blocked')) return 'checking';
    if (it.listing.absent_runs >= 2) return 'delisted';
    if (it.listing.absent_runs === 1) return 'absent1';
    return it.listing.last_listed_at === it.listing.last_complete_check_at ? 'listed' : 'checking';
  }

  function isOperating(it, asOf, site) {
    if (it.kind !== 'promotion') return false;
    const p = periodStatus(it, asOf), x = exposureStatus(it, site);
    if (p === 'withdrawn' || p === 'ended' || p === 'upcoming') return false;
    if (x === 'listed') return true;
    if (x === 'unverifiable') return p === 'active';
    return false;
  }

  function sideOf(it, ours) {
    if (!it.company_ids.length) return 'industry';
    return it.company_ids.some((c) => ours.includes(c)) ? 'ours' : 'competitor';
  }

  // ---- 필터 (설계서 3.1, 기획서 2장: 공통·전체는 포함, 미지정은 제외, '미지정'은 미지정만)
  function axisMatch(values, want, wide) {
    if (!want || want === 'all') return true;
    if (want === 'unassigned') return values.length === 1 && values[0] === 'unassigned';
    return values.includes(want) || values.includes(wide);
  }

  function matchesFilters(it, f) {
    if (!axisMatch(it.markets, f.market, 'common')) return false;
    if (!axisMatch(it.nationalities, f.nationality, 'all')) return false;
    if (!axisMatch(it.customer_structures, f.structure, 'all')) return false;
    if (it.kind === 'promotion') {
      if (f.channel && f.channel !== 'all' && !it.channels.includes(f.channel)) return false;
      if (f.locale && f.locale !== 'all' && it.locale !== f.locale) return false;
      if (f.type && f.type !== 'all' && !it.promo_types.includes(f.type)) return false;
      if (f.campaign && f.campaign !== 'all' && !it.campaign_tags.includes(f.campaign)) return false;
    } else if ((f.channel && f.channel !== 'all') || (f.locale && f.locale !== 'all') ||
               (f.type && f.type !== 'all') || (f.campaign && f.campaign !== 'all')) {
      return false; // 행사 전용 축을 고르면 업계동향은 빠진다
    }
    return true;
  }

  // ---- 변경 이력
  function lastDelistDate(changes, itemId) {
    let d = null;
    for (const c of changes) {
      if (c.item_id !== itemId) continue;
      if (c.type === 'delisted') d = c.detected_at.slice(0, 10);
      if (c.type === 'relisted') d = null;
    }
    return d;
  }

  // ---- 비교 (설계서 3.2–3.3). 회사 단위는 group_key로 묶어 센다
  function compare(items, filters, ctx) {
    const { asOf, ours, sites, changes } = ctx;
    const recent = new Set(changes.filter((c) => withinDays(c.detected_at, asOf, 7) && c.type === 'first_seen').map((c) => c.item_id));
    const rows = TYPES.map((type) => ({ type, ours: new Map(), comp: new Map(), byCompany: {} }));
    const idx = Object.fromEntries(rows.map((r) => [r.type, r]));
    for (const it of items) {
      if (it.kind !== 'promotion' || !matchesFilters(it, filters)) continue;
      if (!isOperating(it, asOf, sites[it.site_id])) continue;
      const key = it.group_key || it.id;
      const side = sideOf(it, ours);
      for (const t of it.promo_types) {
        const r = idx[t];
        const bucket = side === 'ours' ? r.ours : r.comp;
        if (!bucket.has(key)) bucket.set(key, { item: it, isNew: recent.has(it.id) });
        if (side !== 'ours') {
          const co = it.company_ids[0];
          r.byCompany[co] = r.byCompany[co] || new Map();
          if (!r.byCompany[co].has(key)) r.byCompany[co].set(key, it);
        }
      }
    }
    return rows.map((r) => {
      const o = r.ours.size, c = r.comp.size;
      return {
        type: r.type,
        ours: [...r.ours.values()],
        comp: [...r.comp.values()],
        byCompany: Object.fromEntries(Object.entries(r.byCompany).map(([k, m]) => [k, m.size])),
        flag: o && c ? 'both' : o ? 'ours_only' : c ? 'comp_only' : 'none',
      };
    });
  }

  // ---- 신라 vs 경쟁사 요약 카드
  function sideSummary(items, filters, ctx, side) {
    const { asOf, ours, sites, changes } = ctx;
    const inSide = items.filter((it) => it.kind === 'promotion' && sideOf(it, ours) === side && matchesFilters(it, filters));
    const ids = new Set(inSide.map((it) => it.id));
    const uniq = (arr) => new Set(arr.map((it) => it.group_key || it.id)).size;
    const ev = changes.filter((c) => ids.has(c.item_id) && withinDays(c.detected_at, asOf, 7));
    const byId = Object.fromEntries(inSide.map((it) => [it.id, it]));
    const evItems = (types) => [...new Set(ev.filter((c) => types.includes(c.type)).map((c) => c.item_id))].map((i) => byId[i]);
    const endedRecently = inSide.filter((it) => it.end_on && it.end_on < asOf && withinDays(it.end_on, asOf, 7));
    const delisted = evItems(['delisted']);
    return {
      operating: uniq(inSide.filter((it) => isOperating(it, asOf, sites[it.site_id]))),
      fresh: uniq(evItems(['first_seen'])),
      changed: uniq(evItems(['field_changed', 'relisted'])),
      gone: uniq([...endedRecently, ...delisted]),
    };
  }

  // ---- 요약 자리표시자 (설계서 6.5)
  const CUR = { USD: '달러', KRW: '원', CNY: '위안', JPY: '엔', SGD: '싱가포르달러' };
  const md = (d) => `${+d.slice(5, 7)}.${+d.slice(8, 10)}`;

  function formatOffer(o) {
    if (!CONFIRMED.has(o.quality)) return '혜택 검증 필요';
    const u = o.currency ? (CUR[o.currency] || o.currency) : '';
    const pu = o.purchase_currency ? (CUR[o.purchase_currency] || o.purchase_currency) : u;
    const parts = [];
    if (o.min_purchase != null) parts.push(`${o.min_purchase.toLocaleString('ko-KR')}${pu} 이상`);
    if (o.amount != null) parts.push(`${o.amount.toLocaleString('ko-KR')}${u}`);
    if (o.rate_pct != null) parts.push(`${o.is_max ? '최대 ' : ''}${o.rate_pct}%`);
    return parts.length ? parts.join(' ') : o.description_ko;
  }

  function formatPeriod(it) {
    if (!(it.start_on && it.end_on)) return '기간 미확인';
    const q = it.field_quality;
    if (!CONFIRMED.has(q.start_on) || !CONFIRMED.has(q.end_on)) return `${md(it.start_on)}~${md(it.end_on)} 검증 필요`;
    return `${md(it.start_on)}~${md(it.end_on)}`;
  }

  function renderPlaceholders(text, byId) {
    return text.replace(/\{\{(period|offer):((?:prm|iss)_[0-9]{8}_[0-9a-f]{6})(?::([0-9]+))?\}\}/g, (_, kind, id, n) => {
      const it = byId[id];
      if (!it) return '미확인';
      if (kind === 'period') return formatPeriod(it);
      const o = it.offers[+n];
      return o ? formatOffer(o) : '미확인';
    });
  }

  const api = {
    TYPES, CONFIRMED, iso, addDays, daysBetween, withinDays, toDate,
    periodStatus, exposureStatus, isOperating, sideOf, matchesFilters, lastDelistDate,
    compare, sideSummary, formatOffer, formatPeriod, renderPlaceholders,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Derive = api;
})(typeof self !== 'undefined' ? self : this);

<script>
/* DF Radar 화면(2026-10-18 에디토리얼 리디자인). 메뉴: Home(오늘의 브리핑) · 리테일 · 면세업계 · 면세 4사 · 저장된 기사 + 머리띠의 통합 검색.

   item.classification(단계·카테고리·기업·관련 기업·필터·검토 사유)과 4사 프로모션의 item.event(행사명·기간·혜택·점포)를 읽기만 한다.

   - 리테일·면세업계: 카테고리 → 기간·상세 필터 → 날짜별 기사 | 오른쪽에 그 단계 주간 요약(없으면 목록이 전체 폭).

   - 검색: 제목·내용·매체·행사명, 단계·카테고리·기업·기간·필터·분류 검토만, 엑셀 복사·CSV.
   - 저장된 기사(메뉴 탭): 기사 줄·상세의 ☆로 모은다. 이 브라우저(localStorage)에만 남고 서버·저장소로 보내지 않는다.

(function () {
  // 스크립트가 어디서든 죽으면 빈 화면 대신 오류 띠를 보인다
  window.addEventListener('error', (e) => {
    const v = document.getElementById('view'); if (!v || v.dataset.err) return; v.dataset.err = '1';

  'use strict';

  const { items, changes, sites, meta, taxonomy: T } = DATA;
  const H = T.hierarchy || {};

  const coMark = (c, full = false) => `<span class="cm co-${esc(c)}">${esc(full ? coFull(c) : coName(c))}</span>`;

  const VIEWS = [['brief', 'Home'], ['retail', '리테일'], ['dutyfree', '면세업계'], ['big4', '면세 4사'], ['saved', '저장된 기사']];
  const state = {

  const readHash = () => {

    else state.cat[v] = CAT(v).some(([k]) => k === a) ? a : 'all';

  readHash();
  const writeHash = () => {

    const h = v === 'search' || v === 'brief' || v === 'saved' ? v : v === 'big4' ? ['big4', state.co, state.cat.big4 !== 'all' ? state.cat.big4 : ''].filter(Boolean).join('/') : [v, state.cat[v] !== 'all' ? state.cat[v] : ''].filter(Boolean).join('/');
    try { history.replaceState(null, '', `#${h}`); } catch (e) { /* 틀 안 */ }

  // ---------- 도우미
  const $ = (s) => document.querySelector(s);

  const md = (d) => d ? `${+d.slice(5, 7)}.${+d.slice(8, 10)}` : '';
  const ymd = (d) => d ? (d.slice(0, 4) === asOf.slice(0, 4) ? md(d) : `${d.slice(2, 4)}.${md(d)}`) : '';
  const hm = (t) => t ? t.slice(11, 16) : '';
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const dow = (d) => DOW[D.toDate(d).getDay()];
  const longDate = (d) => `${+d.slice(0, 4)}년 ${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일 ${dow(d)}요일`;
  const dayHead = (d) => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일 ${dow(d)}요일${d.slice(0, 4) !== asOf.slice(0, 4) ? ` · ${d.slice(0, 4)}` : ''}`;
  const safeUrl = (u) => /^https?:\/\//.test(u || '') ? u : null;
  const short = (s, n) => (String(s || '').length > n ? `${String(s).slice(0, n)}…` : String(s || ''));
  const dateOf = (it) => (it.published_at || it.first_seen_at || '').slice(0, 10);
  const newest = (a, b) => dateOf(b).localeCompare(dateOf(a)) || b.sources.length - a.sources.length;
  const loudest = (a, b) => b.sources.length - a.sources.length || newest(a, b);
  const pubs = (it) => [...new Set(it.sources.map((s) => s.publisher).filter(Boolean))];
  // 요약 앞의 매체 머리말([서울=뉴시스] ○○○ 기자 =)은 보일 때만 지운다(데이터는 그대로)
  const BYLINE = (H.byline || []).length ? new RegExp(H.byline.join('|'), 'g') : null;

  // ---------- 기간: 일 · 주(기준일까지 7일) · 월 · 사용자 지정 (검색은 전체도)

  const addMonths = (d, n) => { const x = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1 + n, 1); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-01`; };
  function rangeOf(unit, anchor = state.per.anchor) {

    const f = D.addDays(a, -6); return { from: f, to: a, label: `${ymd(f)} – ${ymd(a)}` };
  }
  const curUnit = () => (state.view === 'search' && state.sPer === 'all' ? 'all' : state.per.unit);
  const range = () => rangeOf(curUnit());
  const LAST7 = () => rangeOf('week', asOf);
  const inRange = (it, r = range()) => { const d = dateOf(it); return !!d && d >= r.from && d <= r.to; };
  function shiftPeriod(dir) {

  // ---------- 상세 필터(카테고리와 섞지 않는 독립 축)
  const facetsFor = (view) => FACETS.filter((f) => {

  const activeFacets = () => Object.entries(state.f).filter(([, v]) => v);

  // ---------- 고르기
  function scopeOf(view, { co = state.co, related = false } = {}) {
    return pool.filter((it) => {

        return c.level === 'big4' && (co === 'all' || c.companies.includes(co));
      }

    });
  }

  // ---------- 기사 한 줄(카드 없이: 꼬리표 · 제목 · 요약 · 출처)
  const reviewMark = (it) => cls(it).review.length ? `<span class="rv" data-tip="${esc(cls(it).review.map((r) => REVIEW[r] || r).join(' · '))}">분류 검토</span>` : '';
  const facetText = (it) => { const f = cls(it).facets; return [...f.markets.map((v) => facetLabel('markets', v)), ...f.channels.map((v) => facetLabel('channels', v)), ...f.nationalities.map((v) => facetLabel('nationalities', v)), ...f.structures].join('·'); };
  const pathOf = (it) => {
    const c = cls(it);

    return [LV[c.level], ...(c.level === 'big4' ? [c.companies.map(coName).join('·')] : []), catLabel(c.level, c.category)];
  };
  const periodText = (ev) => ev.start_on && ev.end_on ? `${ymd(ev.start_on)}–${ymd(ev.end_on)}` : ev.end_on ? `~${ymd(ev.end_on)}` : ev.start_on ? `${ymd(ev.start_on)}~` : ev.period_text || '';
  // 행사 정보: 확인된 칸만(없는 칸은 보이지 않는다)
  function evLine(it) {
    const ev = it.event; if (!ev) return '';
    const parts = [];
    if (ev.name) parts.push(`<span><i>행사</i>${esc(ev.name)}</span>`);
    if (periodText(ev)) parts.push(`<span><i>기간</i>${esc(periodText(ev))}</span>`);
    if (ev.benefits.length) parts.push(`<span><i>혜택</i>${esc(ev.benefits.slice(0, 2).join(', '))}</span>`);
    if (ev.stores.length) parts.push(`<span><i>점포</i>${esc(ev.stores.slice(0, 3).join(', '))}</span>`);
    return parts.length ? `<span class="ev">${parts.join('')}</span>` : '';
  }
  // how: 'level'(카테고리) · 'co'(카테고리, 기업 화면) · 'big4'(카테고리 · 기업) · 'full'(단계 › 카테고리 · 기업) · 'col'(단 머리가 카테고리: 업태만)
  function kicker(it, how) {
    const c = cls(it);
    if (how === 'col') {
      const parts = [c.detail && SECTOR[c.detail] ? `<span class="kick">${esc(SECTOR[c.detail])}</span>` : '', c.related_companies.length ? `<span class="rel">관련 ${c.related_companies.map((x) => coMark(x)).join('')}</span>` : '', reviewMark(it)].filter(Boolean);
      return parts.join('');
    }
    const cat = `${catLabel(c.level, c.category)}${how === 'level' && c.detail && SECTOR[c.detail] ? ` · ${SECTOR[c.detail]}` : ''}`;
    const head = how === 'full' ? `${LV[c.level]} › ${cat}` : cat;
    const cos = (how === 'big4' || how === 'full') && c.companies.length ? c.companies.map((x) => coMark(x)).join('') : '';
    const rel = how !== 'full' && c.related_companies.length ? `<span class="rel">관련 ${c.related_companies.map((x) => coMark(x)).join('')}</span>` : '';
    return `<span class="kick">${esc(head)}</span>${cos}${rel}${reviewMark(it)}`;
  }
  const metaOf = (it, { date = true, facets = true } = {}) => {
    const parts = [short(pubs(it).join(', '), 40)];
    if (date) parts.push(ymd(dateOf(it)));
    if (it.sources.length > 1) parts.push(`보도 ${it.sources.length}곳`);
    if (facets && facetText(it)) parts.push(facetText(it));
    return parts.filter(Boolean).map(esc).join(' · ');
  };
  // size: 'lead'(첫 기사) · 'md'(목록) · 'sm'(브리핑 단 · 옆 칸, 요약 없음)
  function story(it, how, { size = 'md', date = true, summary = true } = {}) {
    const sum = summary && size !== 'sm' ? (it.event && evLine(it)) || `<p class="sum">${esc(short(sumOf(it), size === 'lead' ? 260 : 150))}</p>` : (it.event && size === 'sm' ? evLine(it) : '');
    return `<article class="story ${size}"><button class="hit" data-item="${esc(it.id)}">
      ${(() => { const k = kicker(it, how); return k ? `<span class="kicker">${k}</span>` : ''; })()}<span class="hl">${esc(it.title_ko)}</span>${sum}
      <span class="meta">${metaOf(it, { date, facets: size !== 'sm' })}</span></button>${size === 'sm' ? '' : saveBtn(it.id)}</article>`;
  }
  // 날짜별 묶음(신문의 날짜 줄처럼). 줄 안의 날짜는 생략
  function byDay(arr, how) {
    let html = '', day = null;
    for (const it of arr) {
      const d = dateOf(it);
      if (d !== day) { if (day !== null) html += '</div>'; day = d; html += `<h4 class="day">${d ? dayHead(d) : '날짜 없음'}</h4><div class="stories">`; }
      html += story(it, how, { date: false });
    }
    return html ? `${html}</div>` : '';
  }
  const emptyHtml = (msg) => `<div class="empty"><p>${esc(msg || '이 기간·조건에 해당하는 기사가 없습니다.')}</p>${state.per.unit !== 'month' && state.view !== 'search' ? '<button class="more" data-widen>기간을 한 달로 넓히기</button>' : ''}</div>`;

  // ---------- AI 주간 요약(근거 기사 번호). 가장 최근 파일, 지금 분류로 그 단계인 기사를 근거로 한 문장만
  const weeklyStale = () => !!(weekly?.window?.to && weekly.window.to < D.addDays(asOf, -6));
  function weeklySentences(lv, co = 'all') {
    const fits = (id) => byId[id] && cls(byId[id]).level === lv && (co === 'all' || cls(byId[id]).companies.includes(co));
    return (weekly?.levels?.[lv]?.sentences || []).filter((s) => s.item_ids.some(fits)).map((s) => ({ text: s.text, refs: s.item_ids.filter(fits) }));
  }
  const refLinks = (refs) => refs.map((id, i) => { const it = byId[id]; return `<button class="ref" data-item="${esc(id)}" aria-label="근거 기사: ${esc(it.title_ko)}" data-tip="${esc(`${it.title_ko} — ${pubs(it)[0] || ''} ${ymd(dateOf(it))}`)}">${i + 1}</button>`; }).join('');
  const weeklyNote = () => `${weeklyStale() ? '지난 주간 요약' : 'AI 주간 요약'} · ${md(weekly.window?.from)}–${md(weekly.window?.to)}`;

  // ---------- 카테고리·기업 텍스트 탭, 기간, 상세 필터
  function textTabs(items, cur, key, { size = '' } = {}) {
    const coCls = (k) => (key === 'co' || key === 'sco' || key === 'vco') && COS.includes(k) ? `co-${k} cotab` : '';
    return `<nav class="ttabs ${size}" aria-label="${key === 'co' || key === 'sco' || key === 'vco' ? '기업' : key === 'vlv' || key === 'slv' ? '단계' : '카테고리'}">${items.map(([k, v, n]) => { const cl = [coCls(k), n === 0 && cur !== k && k !== 'all' ? 'zero' : ''].filter(Boolean).join(' '); return `<button data-${key}="${k}" aria-pressed="${cur === k}"${cl ? ` class="${cl}"` : ''}>${esc(v)}${n !== undefined ? `<span class="n">${n}</span>` : ''}</button>`; }).join('')}</nav>`;
  }
  function catTabs(lv, base, cur) {
    const n = (k) => base.filter((it) => k === 'all' || cls(it).category === k).length;
    return textTabs([['all', '전체', n('all')], ...CAT(lv).map(([k, v]) => [k, v, n(k)])], cur, 'cat');
  }
  function periodCtl() {
    const units = [['day', '일'], ['week', '주'], ['month', '월'], ['custom', '지정']];
    const opts = state.view === 'search' ? [['all', '전체'], ...units] : units;
    const cur = curUnit(), r = range();
    const nav = cur === 'custom' ? `<span class="per-custom"><input type="date" id="pf" value="${esc(state.per.from)}" max="${asOf}" aria-label="시작일"><span>–</span><input type="date" id="pt" value="${esc(state.per.to)}" max="${asOf}" aria-label="종료일"></span>`
      : cur === 'all' ? '' : `<span class="per-nav"><button data-shift="-1" aria-label="이전 기간">‹</button><span class="num">${esc(r.label)}</span><button data-shift="1" aria-label="다음 기간"${r.to >= asOf ? ' disabled' : ''}>›</button></span>`;
    return `<div class="per"><span class="lab">기간</span><span class="opts" role="group" aria-label="기간">${opts.map(([k, v]) => `<button data-unit="${k}" aria-pressed="${cur === k}">${v}</button>`).join('')}</span>${nav}</div>`;
  }
  function filterCtl(base) {
    const fs = facetsFor(state.view);
    const act = activeFacets().filter(([k]) => fs.some((f) => f.key === k));
    const pills = act.map(([k, v]) => `<button class="fon" data-fclear="${k}" aria-label="${esc(facetLabel(k, v))} 필터 지우기">${esc(H.facets[k].label)}: ${esc(facetLabel(k, v))} <span aria-hidden="true">×</span></button>`).join('');
    const panel = state.fopen ? `<div class="fpanel">${fs.map((f) => {
      const sub = base.filter((it) => passFacets(it, f.key));
      const n = (v) => sub.filter((it) => (cls(it).facets[f.key] || []).includes(v)).length;
      return `<div class="fg"><span class="lab">${esc(f.label)}</span><span class="opts"><button data-facet="${f.key}" data-fv="" aria-pressed="${!state.f[f.key]}">전체</button>${f.values.map(([v, l]) => { const c = n(v); return `<button data-facet="${f.key}" data-fv="${v}" aria-pressed="${state.f[f.key] === v}"${!c && state.f[f.key] !== v ? ' disabled' : ''}>${esc(l)}${c ? `<span class="n">${c}</span>` : ''}</button>`; }).join('')}</span></div>`;
    }).join('')}<p class="note">기사 제목·요약에 그 말이 있을 때만 걸립니다(추정하지 않음). 시장은 지역, 판매채널은 파는 곳 — 온라인은 시장이 아닙니다.</p></div>` : '';
    return `<div class="fbar"><button class="ftoggle" data-ftoggle aria-expanded="${state.fopen}">상세 필터${act.length ? ` <span class="n">${act.length}</span>` : ''}</button>${pills}</div>${panel}`;
  }
  const toolbar = (base, extra = '') => `<div class="toolbar">${periodCtl()}${filterCtl(base)}${extra}</div>`;
  const pageHead = (title, desc, right = '') => `<header class="phead"><h1>${esc(title)}</h1>${desc ? `<p class="dek">${esc(desc)}</p>` : ''}${right}</header>`;

  // ---------- 저장한 기사: 이 브라우저(localStorage)에만. 서버·저장소로 보내지 않는다.
  // 기사마다 제목·원문 주소·출처·날짜·분류 경로를 같이 남겨, 나중에 수집 목록에서 빠져도 원문으로 갈 수 있게 한다.
  const SAVE_KEY = 'dfradar.saved.v1';
  let storageOk = true;
  const loadSaved = () => {
    try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]'); storageOk = true; return Array.isArray(v) ? v.filter((x) => x && typeof x.id === 'string') : []; }
    catch (e) { storageOk = false; return []; }
  };
  let saved = loadSaved();
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); storageOk = true; } catch (e) { storageOk = false; } };
  const isSaved = (id) => saved.some((x) => x.id === id);
  const snapshot = (it) => ({ id: it.id, saved_at: new Date().toISOString(), title: it.title_ko, url: safeUrl(it.sources[0]?.url) || null, publisher: pubs(it)[0] || '', date: dateOf(it), path: pathOf(it).filter(Boolean).join(' › '),
    level: cls(it).level, category: cls(it).category, companies: cls(it).companies, related: cls(it).related_companies });
  function toggleSave(id) {
    if (isSaved(id)) saved = saved.filter((x) => x.id !== id);
    else if (byId[id]) saved = [snapshot(byId[id]), ...saved];
    persist();
  }
  const saveBtn = (id, big = false) => { const on = isSaved(id); return `<button class="${big ? 'save-lg' : 'save'}" data-save="${esc(id)}" aria-pressed="${on}" aria-label="${on ? '저장 취소' : '기사 저장'}" title="${on ? '저장 취소' : '저장'}">${big ? (on ? '★ 저장됨' : '☆ 저장') : (on ? '★' : '☆')}</button>`; };
  // 화면을 다시 그리지 않고 단추·머리띠 건수만 바꾼다(저장 화면은 다시 그린다)
  function refreshSaveMarks() {
    for (const b of document.querySelectorAll('[data-save]')) {
      const on = isSaved(b.dataset.save), big = b.classList.contains('save-lg');
      b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? '저장 취소' : '기사 저장'); b.title = on ? '저장 취소' : '저장';
      b.textContent = big ? (on ? '★ 저장됨' : '☆ 저장') : (on ? '★' : '☆');
    }
    const n = $('#tab-saved .n'); if (n) n.textContent = saved.length || '';
  }
  const localDay = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function savedRow(x) {
    const it = byId[x.id];
    if (it) return story(it, 'full');
    // 지금 데이터에 없는 기사: 남겨 둔 제목·원문 링크만
    const title = x.url ? `<a class="hl" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)} ↗</a>` : `<span class="hl">${esc(x.title)}</span>`;
    return `<article class="story md gone"><div class="hit">${x.path ? `<span class="kicker"><span class="kick">${esc(x.path)}</span></span>` : ''}${title}
      <span class="meta">${esc([x.publisher, ymd(x.date), '지금 수집 목록에 없는 기사 — 원문 링크만'].filter(Boolean).join(' · '))}</span></div>${saveBtn(x.id)}</article>`;
  }
  // 저장된 기사 거르기: 검색어 · 단계 → 카테고리 · 기업(주인공·관련) · 상세 필터 · 정렬. 다른 화면의 고르기와 따로 둔다(상세 필터만 같이 쓴다)
  // 지금 데이터에 없는 기사는 저장할 때 남긴 분류로 거르고, 상세 필터가 걸리면 뺀다(필터 값을 남겨 두지 않았다)
  const savedCls = (x) => { const it = byId[x.id]; return it ? cls(it) : { level: x.level || 'none', category: x.category || null, companies: x.companies || [], related_companies: x.related || [] }; };
  function savedMatch(x, { skipLv = false, skipCat = false, skipCo = false, facets = true } = {}) {
    const c = savedCls(x), it = byId[x.id];
    if (!skipLv && state.vLv !== 'all' && c.level !== state.vLv) return false;
    if (!skipCat && state.vLv !== 'all' && state.vCat !== 'all' && c.category !== state.vCat) return false;
    if (!skipCo && state.vCo !== 'all' && !c.companies.includes(state.vCo) && !c.related_companies.includes(state.vCo)) return false;
    if (facets && activeFacets().length && !(it && passFacets(it))) return false;
    const q = state.vQ.trim().toLowerCase();
    if (q && !(it ? `${it.title_ko} ${it.title_original || ''} ${it.summary_ko} ${it.event?.name || ''} ${pubs(it).join(' ')}` : `${x.title} ${x.publisher}`).toLowerCase().includes(q)) return false;
    return true;
  }
  const savedDate = (x) => (byId[x.id] ? dateOf(byId[x.id]) : x.date) || '';
  const savedFiltered = () => saved.filter((x) => savedMatch(x)).sort((a, b) => state.vSort === 'date'
    ? savedDate(b).localeCompare(savedDate(a)) || String(b.saved_at).localeCompare(String(a.saved_at))
    : String(b.saved_at).localeCompare(String(a.saved_at)));
  const savedFilterOn = () => state.vQ.trim() || state.vLv !== 'all' || state.vCo !== 'all' || activeFacets().length;
  function savedList() {
    const list = savedFiltered();
    if (!list.length) return `<div class="empty"><p>조건에 맞는 저장 기사가 없습니다.</p><button class="more" data-vreset>조건 지우기</button></div>`;
    let body = '', head = null;
    for (const x of list) {
      const k = state.vSort === 'date' ? savedDate(x) : localDay(x.saved_at);
      if (k !== head) { if (head !== null) body += '</div>'; head = k; body += `<h4 class="day">${k ? `${dayHead(k)}${state.vSort === 'date' ? ' 기사' : ' 저장'}` : '날짜 없음'}</h4><div class="stories">`; }
      body += savedRow(x);
    }
    return `${body}</div>`;
  }
  const savedCount = () => { const n = savedFiltered().length; return savedFilterOn() ? `${n}건 / 전체 ${saved.length}건` : `${saved.length}건`; };
  function viewSaved() {
    const warn = storageOk ? '' : '<p class="warn">이 브라우저는 저장을 막고 있어(사생활 보호 모드 등) 페이지를 닫으면 저장한 기사가 사라집니다.</p>';
    const head = pageHead('저장된 기사', '이 브라우저에만 저장됩니다. 다른 기기·브라우저와 공유되지 않고, 서버로 보내지 않습니다.');
    if (!saved.length) return `${head}${warn}<div class="empty"><p>아직 저장한 기사가 없습니다. 기사 줄 오른쪽 ☆이나 기사 상세의 ‘☆ 저장’을 누르면 여기에 모입니다.</p></div>`;
    const n = (pred) => saved.filter(pred).length;
    const lvTabs = textTabs([['all', '전체 단계', n((x) => savedMatch(x, { skipLv: true, skipCat: true }))], ...LVS.map((l) => [l, LV[l], n((x) => savedMatch(x, { skipLv: true, skipCat: true }) && savedCls(x).level === l)])], state.vLv, 'vlv');
    const catT = state.vLv !== 'all' ? textTabs([['all', '전체', n((x) => savedMatch(x, { skipCat: true }))], ...CAT(state.vLv).map(([k, v]) => [k, v, n((x) => savedMatch(x, { skipCat: true }) && savedCls(x).category === k)])], state.vCat, 'vcat') : '';
    const coT = textTabs([['all', '전체 기업', n((x) => savedMatch(x, { skipCo: true }))], ...COS.map((c) => [c, coName(c), n((x) => savedMatch(x, { skipCo: true }) && (savedCls(x).companies.includes(c) || savedCls(x).related_companies.includes(c)))])], state.vCo, 'vco');
    const sortCtl = `<div class="per"><span class="lab">정렬</span><span class="opts" role="group" aria-label="정렬">${[['saved', '저장한 순'], ['date', '기사 날짜 순']].map(([k, v]) => `<button data-vsort="${k}" aria-pressed="${state.vSort === k}">${v}</button>`).join('')}</span></div>`;
    const base = saved.filter((x) => byId[x.id] && savedMatch(x, { facets: false })).map((x) => byId[x.id]);
    return `${head}${warn}
      <div class="sbox"><input type="search" id="q3" placeholder="저장한 기사에서 찾기(제목·내용·매체·행사명)" value="${esc(state.vQ)}" aria-label="저장한 기사 검색"></div>
      ${lvTabs}${catT}${coT}
      <div class="toolbar">${sortCtl}${filterCtl(base)}</div>
      <div class="sbar"><span class="num" id="vcount">${savedCount()}</span><span class="acts">${savedFilterOn() ? '<button class="more" data-vreset>조건 지우기</button>' : ''}<button class="more" id="scopy">엑셀로 복사</button></span></div>
      <div class="list search-list" id="vlist">${savedList()}</div>
      <div id="dcopy-box" hidden><p class="note">자동 복사가 막혀 있습니다. 아래 글을 모두 선택해 복사(Ctrl+C)한 뒤 엑셀에 붙여 넣으세요.</p><textarea id="dcopy-text" rows="8" readonly></textarea></div>`;
  }

  // ---------- 오늘의 브리핑
  function viewBrief() {
    const r7 = LAST7();
    const used = new Set();
    const take = (arr, n) => { const out = []; for (const it of arr) { if (out.length >= n) break; if (used.has(it.id)) continue; out.push(it); used.add(it.id); } return out; };
    const recent = (lv) => pool.filter((it) => cls(it).level === lv && inRange(it, r7));
    const df = recent('dutyfree'), b4 = recent('big4'), rt = recent('retail');
    // 주간 요약: 단계마다 두 문장까지(리테일 → 면세업계 → 면세 4사)
    const wk = weekly ? LVS.map((lv) => [lv, weeklySentences(lv).slice(0, 2)]).filter(([, s]) => s.length) : [];
    const wkHtml = wk.length ? `<section class="wk" aria-label="주간 요약"><h2 class="label">${esc(weeklyNote())}<span class="note">AI가 기사로 쓴 문장 · 번호를 누르면 근거 기사</span></h2>
      <div class="wk-cols" style="--n:${wk.length}">${wk.map(([lv, ss]) => `<div><h3>${esc(LV[lv])}</h3><ul>${ss.map((s) => `<li>${esc(s.text)}${refLinks(s.refs)}</li>`).join('')}</ul></div>`).join('')}</div></section>` : '';
    // 카테고리별 단(이미 위에 나온 기사는 빼고 최신 3건)
    const cols = (lv, arr) => `<div class="cols cols-${CAT(lv).length}">${CAT(lv).map(([k, v]) => {
      const list = take(arr.filter((it) => cls(it).category === k).sort(newest), 3);
      return `<section class="col"><h3><button data-go="${lv}/${k}">${esc(v)}</button></h3>${list.length ? `<div class="stories">${list.map((it) => story(it, 'col', { size: 'sm' })).join('')}</div>` : '<p class="none">최근 7일 기사 없음</p>'}</section>`;
    }).join('')}</div>`;
    // 면세업계 주요 이슈: 여러 매체가 다룬 순(같으면 최신). 왼쪽 큰 기사 + 2건, 오른쪽 다음 4건
    const top = [...df].sort(loudest);
    const lead = take(top, 1), sec = take(top, 2), more = take(top, 4);
    const dfTop = lead.length ? `<div class="lead-grid">
        <div class="main-col">${story(lead[0], 'level', { size: 'lead' })}${sec.length ? `<div class="grid2">${sec.map((it) => story(it, 'level')).join('')}</div>` : ''}</div>
        <div class="side-col"><h3 class="label">많이 보도된 소식</h3>${more.length ? `<div class="stories">${more.map((it) => story(it, 'level', { size: 'sm' })).join('')}</div>` : '<p class="none">더 없음</p>'}</div>
      </div>` : '<p class="none">최근 7일 면세업계 기사가 없습니다.</p>';
    // 면세 4사: 기업마다 최신 3건(여러 기업 기사는 기업마다)
    const coCols = COS.map((co) => {
      const arr = b4.filter((it) => cls(it).companies.includes(co)).sort(newest);
      return `<section class="col co-${co}"><h3><button data-go="big4/${co}">${esc(coFull(co))}</button>${arr.length ? `<span class="n">${arr.length}</span>` : ''}</h3>
        ${arr.length ? `<div class="stories">${arr.slice(0, 3).map((it) => story(it, 'co', { size: 'sm' })).join('')}</div>` : '<p class="none">최근 7일 기사 없음</p>'}</section>`;
    }).join('');
    // 단계 순서대로: 리테일 → 면세업계 → 면세 4사
    const rtHtml = cols('retail', rt);
    const dfHtml = `${dfTop}<div class="band-sub">${cols('dutyfree', df)}</div>`;
    return `${pageHead('오늘의 브리핑', `${longDate(asOf)} · 최근 7일(${md(r7.from)}–${md(r7.to)}) 수집 기사`)}
      ${wkHtml}
      <section class="band"><h2 class="sec"><button data-go="retail">리테일 동향</button><span class="note">면세업계에 영향을 주는 유통·소비 환경 · 카테고리별 최신</span></h2>${rtHtml}</section>
      <section class="band"><h2 class="sec"><button data-go="dutyfree">면세업계 주요 동향</button><span class="note">위는 보도한 매체가 많은 순, 아래는 카테고리별 최신</span></h2>${dfHtml}</section>
      <section class="band"><h2 class="sec"><button data-go="big4">면세 4사</button><span class="note">기업별 최신</span></h2><div class="cols cols-4 co-cols">${coCols}</div></section>`;
  }

  // ---------- 목록 + 오른쪽 칸(주간 요약 문장, 기업 화면은 관련 업계 이슈). 옆 칸에 실을 것이 없으면 목록이 전체 폭
  function listWithRail(listHtml, lv, co = 'all', extra = '') {
    const ss = weekly ? weeklySentences(lv, co) : [];

    const side = `${extra}${wkHtml}`;
    return `<div class="list-grid${side ? '' : ' solo'}"><div class="list">${listHtml}</div>${side ? `<aside class="rail">${side}</aside>` : ''}</div>`;
  }

  // ---------- 리테일 · 면세업계
  function viewLevel(lv) {
    const all = scopeOf(lv), cur = state.cat[lv];
    const inPer = all.filter((it) => inRange(it) && passFacets(it));
    const arr = inPer.filter((it) => cur === 'all' || cls(it).category === cur).sort(newest);

      ${catTabs(lv, inPer, cur)}${cur !== 'all' ? `<p class="catdesc">${esc(catDesc(lv, cur))}</p>` : ''}
      ${toolbar(all.filter((it) => (cur === 'all' || cls(it).category === cur) && inRange(it)))}
      ${listWithRail(arr.length ? byDay(arr, 'level') : emptyHtml(), lv)}`;
  }

  // ---------- 면세 4사
  function viewBig4() {
    const co = state.co, cur = state.cat.big4;
    const all = scopeOf('big4', { co });
    const inPer = all.filter((it) => inRange(it) && passFacets(it));
    const arr = inPer.filter((it) => cur === 'all' || cls(it).category === cur).sort(newest);
    const n = (c) => scopeOf('big4', { co: c }).filter((it) => inRange(it) && passFacets(it) && (cur === 'all' || cls(it).category === cur)).length;
    const coTabs = textTabs([['all', '전체 4사', n('all')], ...COS.map((c) => [c, coName(c), n(c)])], co, 'co', { size: 'lg' });
    const head = pageHead('면세 4사', co === 'all' ? '신라·롯데·신세계·현대 면세점이 주인공인 기사. 기업을 고르면 같은 카테고리로 나눠 봅니다.' : `${coFull(co)}이 주인공인 기사`);
    const tools = `${coTabs}${catTabs('big4', inPer, cur)}${cur !== 'all' ? `<p class="catdesc">${esc(catDesc('big4', cur))}</p>` : ''}${toolbar(all.filter((it) => (cur === 'all' || cls(it).category === cur) && inRange(it)))}`;
    if (co === 'all') {
      // 기업별 4단(신문의 단처럼 세로선으로 나눈다). 단마다 최신 8건, 넘치면 기업 화면으로
      const cols = COS.map((c) => {
        const list = arr.filter((it) => cls(it).companies.includes(c));
        return `<section class="col co-${c}"><h3><button data-co="${c}">${esc(coFull(c))}</button>${list.length ? `<span class="n">${list.length}</span>` : ''}</h3>
          ${list.length ? `<div class="stories">${list.slice(0, 8).map((it) => story(it, 'co', { size: 'sm' })).join('')}</div>${list.length > 8 ? `<button class="more" data-co="${c}">${list.length - 8}건 더 보기</button>` : ''}` : '<p class="none">이 기간 기사 없음</p>'}</section>`;
      }).join('');
      const related = scopeOf('big4', { co: 'all', related: true }).filter((it) => inRange(it) && passFacets(it)).sort(newest);
      return `${head}${tools}<div class="cols cols-4 co-cols">${cols}</div>
        ${related.length ? `<section class="band"><h2 class="sec">관련 업계 이슈<span class="note">4사가 언급된 면세업계·리테일 기사 — 같은 기사를 따로 만들지 않고 이어 둔 것</span></h2><div class="list-grid"><div class="list">${byDay(related.slice(0, 12), 'full')}</div><div></div></div></section>` : ''}`;
    }
    const related = scopeOf('big4', { co, related: true }).filter((it) => inRange(it) && passFacets(it)).sort(newest);
    const relHtml = `<section><h3 class="label">관련 업계 이슈</h3>${related.length ? `<div class="stories">${related.slice(0, 8).map((it) => story(it, 'full', { size: 'sm' })).join('')}</div>` : '<p class="none">이 기간에 이 기업이 언급된 면세업계·리테일 기사가 없습니다.</p>'}<p class="note">${esc(coName(co))}가 언급됐지만 주인공은 아닌 기사</p></section>`;
    return `${head}${tools}${listWithRail(arr.length ? byDay(arr, 'co') : emptyHtml(), 'big4', co, relHtml)}`;
  }

  // ---------- 검색 · 전체 기록(보관 포함). 엑셀로 옮긴다
  const isArchived = (it) => archive.includes(it);
  function searchPool({ facets = true } = {}) {
    const q = state.q.trim().toLowerCase(), r = range();
    return [...pool, ...archive.filter((it) => cls(it).level !== 'none')].filter((it) => {
      const c = cls(it);
      if (state.sLv !== 'all' && c.level !== state.sLv) return false;
      if (state.sLv !== 'all' && state.sCat !== 'all' && c.category !== state.sCat) return false;
      if (state.sCo !== 'all' && !c.companies.includes(state.sCo) && !c.related_companies.includes(state.sCo)) return false;
      if (state.sReview && !c.review.length) return false;
      if (!inRange(it, r) || (facets && !passFacets(it))) return false;
      return !q || `${it.title_ko} ${it.title_original || ''} ${it.summary_ko} ${it.event?.name || ''} ${pubs(it).join(' ')}`.toLowerCase().includes(q);
    }).sort((a, b) => dateOf(b).localeCompare(dateOf(a)) || a.id.localeCompare(b.id));
  }
  const fieldsOf = (it) => {
    const c = cls(it), ev = it.event, f = c.facets;
    return { date: dateOf(it), level: LV[c.level] || '미분류', cat: catLabel(c.level, c.category), co: c.companies.map(coName).join('·'), rel: c.related_companies.map(coName).join('·'),
      title: it.title_ko, summary: it.summary_ko || '', market: f.markets.map((v) => facetLabel('markets', v)).join('·'), nat: f.nationalities.map((v) => facetLabel('nationalities', v)).join('·'),
      struct: f.structures.join('·'), channel: f.channels.map((v) => facetLabel('channels', v)).join('·'),
      ev_name: ev?.name || '', ev_period: ev ? (ev.start_on || ev.end_on ? `${ev.start_on || ''}~${ev.end_on || ''}` : ev.period_text || '') : '', ev_benefit: ev ? ev.benefits.join(', ') : '', ev_store: ev ? ev.stores.join(', ') : '',
      review: c.review.map((r) => REVIEW[r] || r).join(' / '), publisher: pubs(it).slice(0, 3).join(', '), n: it.sources.length, url: it.sources[0]?.url || '', status: isArchived(it) ? '보관' : '' };
  };
  const COLS = [['date', '날짜'], ['level', '단계'], ['cat', '카테고리'], ['co', '기업'], ['rel', '관련 기업'], ['title', '제목'], ['summary', '요약'], ['market', '시장'], ['nat', '국적'], ['struct', '고객구조'], ['channel', '판매채널'],
    ['ev_name', '행사명'], ['ev_period', '행사 기간'], ['ev_benefit', '혜택'], ['ev_store', '점포'], ['review', '분류 검토'], ['publisher', '매체'], ['n', '보도 매체 수'], ['url', '원문 주소'], ['status', '상태']];
  function searchList() {
    const rows = searchPool();
    if (!rows.length) return `<div class="empty"><p>${state.q ? `‘${esc(state.q)}’에 맞는 기사가 없습니다.` : '조건에 맞는 기사가 없습니다.'}</p></div>`;
    let html = '', month = null;
    for (const it of rows.slice(0, state.limit)) {
      const m = dateOf(it).slice(0, 7);
      if (m !== month) { if (month !== null) html += '</div>'; month = m; const n = rows.filter((x) => dateOf(x).slice(0, 7) === m).length; html += `<h4 class="day">${m ? `${+m.slice(0, 4)}년 ${+m.slice(5, 7)}월` : '날짜 없음'}<span class="n">${n}건</span></h4><div class="stories">`; }
      html += story(it, 'full');
    }
    html += '</div>';
    if (rows.length > state.limit) html += `<button class="more block" data-more>${rows.length - state.limit}건 더 보기</button>`;
    return html;
  }
  const countText = (rows) => `${rows.length}건${rows.length ? ` · ${LVS.map((l) => `${LV[l]} ${rows.filter((it) => cls(it).level === l).length}`).join(' · ')}` : ''}`;
  function viewSearch() {
    const rows = searchPool();
    let framed = true; try { framed = window.top !== window.self; } catch (e) { framed = true; }
    const lvTabs = textTabs([['all', '전체 단계'], ...LVS.map((l) => [l, LV[l]])], state.sLv, 'slv');
    const catT = state.sLv !== 'all' ? textTabs([['all', '전체'], ...CAT(state.sLv)], state.sCat, 'scat') : '';
    const coT = textTabs([['all', '전체 기업'], ...COS.map((c) => [c, coName(c)])], state.sCo, 'sco');
    const extra = `<label class="chk"><input type="checkbox" id="srv"${state.sReview ? ' checked' : ''}> 분류 검토 대상만</label>`;
    return `${pageHead(state.q ? `‘${state.q}’ 검색` : '검색 · 전체 기록', '지금까지 모은 기사 전체(보관 포함). 기업을 고르면 그 기업이 주인공이거나 언급된 기사가 함께 나옵니다.')}
      <div class="sbox"><input type="search" id="q2" placeholder="제목·내용·매체·행사명" value="${esc(state.q)}" aria-label="검색어"></div>
      ${lvTabs}${catT}${coT}${toolbar(searchPool({ facets: false }), extra)}
      <div class="sbar"><span class="num" id="dcount">${countText(rows)}</span><span class="acts"><button class="more" id="dcopy">엑셀로 복사</button>${framed ? '' : '<button class="more" id="dcsv">CSV 내려받기</button>'}</span></div>
      <div class="list search-list" id="slist">${searchList()}</div>
      <div id="dcopy-box" hidden><p class="note">자동 복사가 막혀 있습니다. 아래 글을 모두 선택해 복사(Ctrl+C)한 뒤 엑셀에 붙여 넣으세요.</p><textarea id="dcopy-text" rows="8" readonly></textarea></div>`;
  }
  const cellTxt = (v) => String(v ?? '').replace(/[\t\r\n]+/g, ' ');
  const savedTsv = () => [['저장일', ...COLS.map((c) => c[1])].join('\t'), ...savedFiltered().map((x) => {
    const f = byId[x.id] ? fieldsOf(byId[x.id]) : { date: x.date, level: x.path, title: x.title, publisher: x.publisher, url: x.url || '', status: '수집 목록에 없음' };
    return [localDay(x.saved_at), ...COLS.map(([k]) => cellTxt(f[k]))].join('\t');
  })].join('\n');
  const tsv = () => [COLS.map((c) => c[1]).join('\t'), ...searchPool().map((it) => { const f = fieldsOf(it); return COLS.map(([k]) => cellTxt(f[k])).join('\t'); })].join('\n');
  const csv = () => '﻿' + [COLS.map((c) => c[1]), ...searchPool().map((it) => { const f = fieldsOf(it); return COLS.map(([k]) => f[k]); })].map((r) => r.map((v) => `"${cellTxt(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');

  // ---------- 서랍(기사 상세)
  let lastFocus = null;
  function openDrawer(html, label) {
    lastFocus = document.activeElement;
    $('#drawer').innerHTML = `<div class="drawer-top"><span class="note">${esc(label)}</span><button id="drawer-close">닫기</button></div>${html}`;
    $('#drawer').hidden = false; $('#drawer-back').hidden = false;
    $('#drawer').scrollTop = 0;
    $('#drawer-close').focus();
  }
  function closeDrawer() {
    $('#drawer').hidden = true; $('#drawer-back').hidden = true;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  const srcLine = (s, primary) => {
    const u = safeUrl(s.url);
    const m2 = `${s.read === 'page' ? '본문 읽음' : '제목·요약문만'}${s.published_at ? ` · ${ymd(s.published_at)}` : ''}`;
    if (primary) return u ? `<p class="src-main"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">원문 기사 열기 ↗</a> <span class="note">${esc(s.publisher)} · ${m2}</span></p>` : `<p><b>${esc(s.publisher)}</b> <span class="note">${m2}</span></p>`;
    return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(s.publisher)}</a>` : esc(s.publisher)} <span class="note">${m2}</span></li>`;
  };
  function itemDrawer(it) {
    const c = cls(it), ev = it.event, f = c.facets;
    const quotes = (it.evidence || []).filter((e) => e.basis !== 'registry');
    const fu = changes.filter((x) => x.item_id === it.id && x.type === 'follow_up_added').length;
    const fv = (k) => (f[k] || []).map((v) => facetLabel(k, v)).join(' · ') || '<span class="muted">원문에 없음</span>';
    const why = Object.entries(c.matched || {}).map(([k, v]) => `${{ level: '단계', category: '카테고리', companies: '기업', related: '관련 기업' }[k] || k}: ${v}`).join(' / ');
    const evHtml = ev ? `<section><h3>행사 정보</h3><dl class="dl"><dt>행사명</dt><dd>${ev.name ? esc(ev.name) : '<span class="muted">제목에 행사명 없음</span>'}</dd>
      <dt>기간</dt><dd class="num">${periodText(ev) ? esc(periodText(ev)) : '<span class="muted">원문에 기간 없음</span>'}${ev.period_text && ev.period_text !== periodText(ev) ? ` <span class="note">원문 “${esc(ev.period_text)}”</span>` : ''}</dd>
      <dt>혜택</dt><dd>${ev.benefits.length ? ev.benefits.map(esc).join('<br>') : '<span class="muted">원문에 혜택 문구 없음</span>'}</dd>
      <dt>점포</dt><dd>${ev.stores.length ? ev.stores.map(esc).join(', ') : '<span class="muted">원문에 점포 없음</span>'}</dd>
      <dt>기업</dt><dd>${c.companies.map((x) => coMark(x, true)).join('')}</dd></dl>
      <p class="note">행사 정보는 기사 글자에서만 뽑았습니다(값을 만들지 않음).${ev.review.length ? ` 확인 필요: ${ev.review.map((r) => EVREVIEW[r] || r).join(' · ')}.` : ''}</p></section>` : '';
    const pathHtml = c.level === 'big4' ? `<span class="kick">${esc(LV.big4)} ›</span>${c.companies.map((x) => coMark(x)).join('')}<span class="kick">› ${esc(catLabel('big4', c.category))}</span>` : `<span class="kick">${esc(pathOf(it).filter(Boolean).join(' › '))}</span>`;
    return `<p class="kicker">${pathHtml}${reviewMark(it)}</p>
      <h2 id="drawer-title">${esc(it.title_ko)}</h2>${it.title_original && it.title_original !== it.title_ko ? `<p class="orig">${esc(it.title_original)}</p>` : ''}
      <p class="meta">${esc(pubs(it).slice(0, 3).join(', '))} · ${ymd(dateOf(it))}${it.sources.length > 1 ? ` · 보도 ${it.sources.length}곳` : ''}</p>
      <p class="dsum">${esc(sumOf(it))}</p>
      <div class="dacts">${srcLine(it.sources[0], true)}${saveBtn(it.id, true)}</div>
      ${evHtml}
      <section><h3>분류</h3><dl class="dl">
        <dt>단계</dt><dd>${esc(LV[c.level] || '미분류')} › ${esc(catLabel(c.level, c.category))}${c.detail && SECTOR[c.detail] ? ` <span class="note">${esc(SECTOR[c.detail])}</span>` : ''}</dd>
        ${c.companies.length ? `<dt>기업</dt><dd>${c.companies.map((x) => coMark(x, true)).join('')}</dd>` : ''}
        ${c.related_companies.length ? `<dt>관련 기업</dt><dd>${c.related_companies.map((x) => coMark(x, true)).join('')} <span class="note">기사에 이름이 나옴(주인공 아님)</span></dd>` : ''}
        <dt>시장</dt><dd>${fv('markets')}</dd><dt>국적</dt><dd>${fv('nationalities')}</dd><dt>고객구조</dt><dd>${fv('structures')}</dd>
        ${c.level !== 'retail' ? `<dt>판매채널</dt><dd>${fv('channels')}</dd>` : ''}
        <dt>근거</dt><dd class="note">${esc(why)}</dd>
        ${c.review.length ? `<dt>검토</dt><dd>${c.review.map((r) => esc(REVIEW[r] || r)).join('<br>')}</dd>` : ''}
      </dl></section>
      <section><h3>보도 ${it.sources.length}곳${fu ? ` · 후속 보도 ${fu}회` : ''}</h3><ul class="srcs">${it.sources.map((s) => srcLine(s, false)).join('')}</ul>
        ${quotes.length ? quotes.map((e) => `<blockquote>“${esc(e.quote)}”</blockquote>`).join('') : ''}
        <p class="note">기사 전문은 저작권 때문에 저장하지 않습니다. 전문은 원문 링크에서 봅니다.</p></section>`;
  }
  function sourcesDrawer() {
    const c = meta.collect || {};
    const nr = Object.entries(sites).filter(([, s]) => s.mode === 'newsroom');
    return `<h2 id="drawer-title">출처 현황</h2><p class="dsum">어디서 기사를 모으는지와 마지막 수집 상태.</p>
      <section><h3>모으는 곳</h3><dl class="dl">
        <dt>뉴스 피드</dt><dd>면세 전문지·여행 전문지·종합지 산업·경제면 RSS와 Bing 뉴스 검색 RSS ${c.feeds || ''}개. robots 규칙을 지키고 기사 원주소만 씁니다.</dd>
        <dt>네이버 뉴스</dt><dd>네이버 뉴스 검색 API(키가 있을 때). 검색 페이지는 읽지 않습니다.</dd>
        <dt>공식 뉴스룸</dt><dd>${nr.length ? nr.map(([, s]) => `${esc(coName(s.company))} 뉴스룸 ${s.status === 'ok' ? '정상' : esc(s.status)}${s.last_run_at ? ` (${md(s.last_run_at)} ${hm(s.last_run_at)})` : ''}`).join(' · ') : '없음'}</dd>
        <dt>분류</dt><dd>제목·요약의 낱말 규칙(config/taxonomy.json). 기사마다 대표 단계 하나·카테고리 하나, 확실하지 않으면 ‘분류 검토’로 표시합니다.</dd>
      </dl></section>
      ${c.last_run ? `<section><h3>마지막 수집</h3><p class="note num">${md(c.last_run.at)} ${hm(c.last_run.at)} · 후보 ${c.last_run.picked}건(${['big4', 'dutyfree', 'retail'].map((l) => `${LV[l]} ${(c.last_run.by_level || {})[l] || 0}`).join(', ')})</p></section>` : ''}
      <p class="note">판독 대기 ${meta.pending_total}건 · 화면 생성 ${md(meta.built_at)} ${hm(meta.built_at)}</p>`;
  }

  // ---------- 그리기
  function renderShell() {
    $('#nav').innerHTML = VIEWS.map(([k, v]) => `<button role="tab" id="tab-${k}" aria-selected="${state.view === k}" data-view="${k}">${esc(v)}${k === 'saved' ? `<span class="n">${saved.length || ''}</span>` : ''}</button>`).join('');
    const q = $('#q'); if (q && document.activeElement !== q) q.value = state.view === 'search' ? state.q : '';
    const fr = meta.collect || {};
    $('#foot').innerHTML = `<span>리테일 브리핑 · 공개 뉴스만 수집 · 자료: 뉴스 피드${fr.feeds ? ` ${fr.feeds}곳` : ''}·네이버 뉴스 검색·공식 뉴스룸</span><span>마지막 갱신 ${md(meta.last_success_at)} ${hm(meta.last_success_at)} · <button class="more" data-sites>출처 현황</button></span>`;
  }
  function render() {
    const main = $('#view');
    try {
      renderShell();
      if (state.view === 'search') main.removeAttribute('aria-labelledby'); else main.setAttribute('aria-labelledby', `tab-${state.view}`);
      main.innerHTML = state.view === 'saved' ? viewSaved() : state.view === 'search' ? viewSearch() : state.view === 'big4' ? viewBig4() : state.view === 'brief' ? viewBrief() : viewLevel(state.view);
    } catch (err) {
      console.error(err);
      main.innerHTML = `<p role="alert" style="margin:12px 0;padding:10px 0;border-top:2px solid #c4313f;color:#c4313f">이 화면을 그리지 못했습니다: ${esc(String(err.message || err))}</p>`;
    }
    writeHash();
  }
  const refreshSearch = () => { $('#slist').innerHTML = searchList(); $('#dcount').textContent = countText(searchPool()); };
  const go = (path) => { location.hash = `#${path}`; readHash(); state.fopen = false; render(); window.scrollTo({ top: 0 }); };

  // ---------- 이벤트
  let qTimer = null;
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q3') { clearTimeout(qTimer); qTimer = setTimeout(() => { state.vQ = e.target.value; $('#vlist').innerHTML = savedList(); $('#vcount').textContent = savedCount(); }, 200); return; }
    if (e.target.id !== 'q2') return;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = e.target.value; state.limit = 120; refreshSearch(); }, 200);
  });
  // 머리띠 검색: Enter로 검색 화면
  $('#qform').addEventListener('submit', (e) => {
    e.preventDefault();
    state.q = $('#q').value.trim(); state.limit = 120; state.view = 'search'; state.fopen = false;
    render(); window.scrollTo({ top: 0 });
    const q2 = $('#q2'); if (q2 && !state.q) q2.focus();
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'pf' || t.id === 'pt') { if (t.value) state.per[t.id === 'pf' ? 'from' : 'to'] = t.value; render(); }
    if (t.id === 'srv') { state.sReview = t.checked; state.limit = 120; render(); }
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a');
    if (!t) return;
    const ds = t.dataset;
    if (t.id === 'drawer-close') return closeDrawer();
    if (ds.save) { toggleSave(ds.save); if (state.view === 'saved') render(); refreshSaveMarks(); return; }
    if (ds.item && byId[ds.item]) return openDrawer(itemDrawer(byId[ds.item]), '기사 상세');
    if (t.hasAttribute('data-sites')) return openDrawer(sourcesDrawer(), '출처 현황');
    if (ds.go) return go(ds.go);
    if (ds.view) { state.view = ds.view; state.fopen = false; render(); window.scrollTo({ top: 0 }); return; }
    if (ds.co) { state.co = ds.co; render(); if (t.classList.contains('more') || t.closest('.co-cols')) window.scrollTo({ top: 0 }); return; }
    if (ds.cat) { state.cat[state.view] = ds.cat; return render(); }
    if (ds.unit) { if (ds.unit === 'all') state.sPer = 'all'; else { state.sPer = 'unit'; state.per.unit = ds.unit; } return render(); }
    if (ds.shift) { shiftPeriod(+ds.shift); return render(); }
    if (t.hasAttribute('data-widen')) { state.per.unit = 'month'; state.per.anchor = asOf; return render(); }
    if (t.hasAttribute('data-ftoggle')) { state.fopen = !state.fopen; return render(); }
    if (ds.facet) { state.f[ds.facet] = ds.fv || null; state.limit = 120; return render(); }
    if (ds.fclear) { state.f[ds.fclear] = null; return render(); }
    if (ds.slv) { state.sLv = ds.slv; state.sCat = 'all'; state.limit = 120; return render(); }
    if (ds.scat) { state.sCat = ds.scat; state.limit = 120; return render(); }
    if (ds.sco) { state.sCo = ds.sco; state.limit = 120; return render(); }
    if (ds.vlv) { state.vLv = ds.vlv; state.vCat = 'all'; return render(); }
    if (ds.vcat) { state.vCat = ds.vcat; return render(); }
    if (ds.vco) { state.vCo = ds.vco; return render(); }
    if (ds.vsort) { state.vSort = ds.vsort; return render(); }
    if (t.hasAttribute('data-vreset')) { Object.assign(state, { vQ: '', vLv: 'all', vCat: 'all', vCo: 'all' }); state.f = { markets: null, nationalities: null, structures: null, channels: null }; return render(); }
    if (t.hasAttribute('data-more')) { state.limit += 120; $('#slist').innerHTML = searchList(); return; }
    if (t.id === 'dcopy' || t.id === 'scopy') {
      const text = t.id === 'scopy' ? savedTsv() : tsv();
      const fallback = () => { $('#dcopy-box').hidden = false; const ta = $('#dcopy-text'); ta.value = text; ta.focus(); ta.select(); };
      try { navigator.clipboard.writeText(text).then(() => { t.textContent = '복사됨 — 엑셀에 붙여 넣으세요'; }, fallback); } catch (err) { fallback(); }
      return;
    }
    if (t.id === 'dcsv') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv()], { type: 'text/csv;charset=utf-8' })); a.download = `df-radar_${asOf}.csv`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
  });
  window.addEventListener('hashchange', () => { if (readHash()) render(); });
  window.addEventListener('storage', (e) => { if (e.key === SAVE_KEY) { saved = loadSaved(); if (state.view === 'saved') render(); else refreshSaveMarks(); } });
  $('#drawer-back').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#drawer').hidden) closeDrawer();
    if (e.key === '/' && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'Tab' && !$('#drawer').hidden) {
      const f = [...$('#drawer').querySelectorAll('button, a[href], summary')];
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  const tip = $('#tip');
  const showTip = (el, x, y) => { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = `${Math.max(8, Math.min(x + 12, innerWidth - r.width - 8))}px`; tip.style.top = `${Math.max(8, y - r.height - 10)}px`; };
  document.addEventListener('pointermove', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.top); } else tip.hidden = true; });
  document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

  render();
})();

</script>

<script>if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});</script>
</body>
</html>
